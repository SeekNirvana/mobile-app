name: seeknirvana
description: "SeekNirvana Smart Ring Health App"
publish_to: 'none'
version: 0.1.1+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  fl_chart: ^1.1.1
  google_fonts: ^8.0.2
  permission_handler: ^12.0.1
  shared_preferences: ^2.3.4
  path_provider: ^2.1.2
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  audioplayers: ^6.0.0
  flutter_tts: ^4.2.5
  synchronized: ^3.3.0+3
  crypto: ^3.0.6
  path: ^1.9.1
  sqflite: ^2.4.2
  flutter_gemma: ^0.13.2
  record: ^6.2.0
  share_plus: ^13.1.0
  whisper_ggml_plus: ^1.5.2
  whisper_ggml_plus_ffmpeg: ^1.0.0
  flutter_markdown_plus: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/SeekNirvana_Logo.png
    - assets/branding/seeknirvana_mark.png
    - assets/branding/seeknirvana_icon_master.png
    - assets/audio/chime-sound.mp3
    - assets/audio/tibetan-bowl-sound.mp3
    - assets/audio/tibetan-singing-bowl.mp3
    - assets/audio/dreaming-modular-sound.mp3
